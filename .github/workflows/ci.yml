name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Garde anti-bump-silencieux : version.json et app.js doivent être en phase
      - run: node tools/check-version.mjs
      # 23 vecteurs du bloc crypto Ninebot ([nb-crypto] de www/app.js)
      - run: node tools/test-ble-vectors.mjs
